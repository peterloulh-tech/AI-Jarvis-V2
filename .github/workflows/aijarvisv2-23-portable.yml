name: AIJARVISV2-23 Windows portable PoC

on:
  workflow_dispatch:
  push:
    branches:
      - codex/aijarvisv2-23
    paths:
      - .github/workflows/aijarvisv2-23-portable.yml
      - tools/aijarvisv2-23/**
      - third_party/runtime/**
      - docs/v2/requirements/templates/**

permissions:
  contents: read

env:
  ARTIFACT_NAME: AIJARVISV2-23-windows-x64-cuda-portable
  CUDA_VERSION: 12.8.1

jobs:
  build-portable:
    if: github.ref_name != 'codex/aijarvisv2-93' && github.ref_name != 'codex/aijarvisv2-93-official-first'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out pinned runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tc-mb/llama.cpp-omni
          ref: b9d15b83ee353b2eaeee4d9318c98a35a1347486
          path: build/task23-runtime-source

      - name: Fetch pinned CUDA redistributable licenses
        shell: pwsh
        run: |
          $redistribBase = "https://developer.download.nvidia.com/compute/cuda/redist"
          $licenseRoot = Join-Path $env:RUNNER_TEMP "task23-cuda-redistributable-licenses"
          New-Item -ItemType Directory -Path $licenseRoot -Force | Out-Null
          $manifestPath = Join-Path $licenseRoot "redistrib_$env:CUDA_VERSION.json"
          Invoke-WebRequest -Uri "$redistribBase/redistrib_$env:CUDA_VERSION.json" -OutFile $manifestPath
          $manifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestSha256 -ne "249e28a83008d711d5f72880541c8be6253f6d61608461de4fcb715554a6cf17") {
            throw "CUDA redistributable manifest hash mismatch: $manifestSha256"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $components = @(
            [pscustomobject]@{ name = "cuda_cudart"; version = "12.8.90"; license_path = "cuda_cudart/LICENSE.txt"; output = "cuda_cudart-LICENSE.txt" },
            [pscustomobject]@{ name = "libcublas"; version = "12.8.4.1"; license_path = "libcublas/LICENSE.txt"; output = "libcublas-LICENSE.txt" }
          )
          foreach ($component in $components) {
            $metadata = $manifest.PSObject.Properties[$component.name].Value
            if ($null -eq $metadata -or $metadata.version -ne $component.version -or
                $metadata.license -ne "CUDA Toolkit" -or
                $metadata.license_path -ne $component.license_path -or
                $null -eq $metadata.PSObject.Properties["windows-x86_64"].Value) {
              throw "CUDA redistributable metadata mismatch for $($component.name)"
            }
            $licensePath = Join-Path $licenseRoot $component.output
            Invoke-WebRequest -Uri "$redistribBase/$($component.license_path)" -OutFile $licensePath
            $licenseSha256 = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($licenseSha256 -ne "e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07") {
              throw "CUDA redistributable license hash mismatch for $($component.name): $licenseSha256"
            }
          }
          "TASK23_CUDA_LICENSE_ROOT=$licenseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned CUDA build toolkit
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "cuda_$env:CUDA_VERSION`_windows_network.exe"
          Invoke-WebRequest `
            -Uri "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$env:CUDA_VERSION`_windows_network.exe" `
            -OutFile $installer
          $cudaMinor = ($env:CUDA_VERSION -split '\.')[0..1] -join '.'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '-s', "nvcc_$cudaMinor", "cudart_$cudaMinor", "cublas_$cudaMinor",
            "cublas_dev_$cudaMinor", "visual_studio_integration_$cudaMinor"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA network installer failed: $($process.ExitCode)" }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$cudaMinor"
          if (-not (Test-Path -LiteralPath (Join-Path $cudaPath 'bin\nvcc.exe'))) {
            throw "CUDA nvcc was not installed under $cudaPath"
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $cudaPath 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare pinned runtime source
        shell: pwsh
        run: |
          $runtimeSource = Join-Path $env:GITHUB_WORKSPACE "build/task23-runtime-source"
          Push-Location $runtimeSource
          try {
            git apply "$env:GITHUB_WORKSPACE/third_party/runtime/patches/0001-text-input-runtime.patch"
            if ($LASTEXITCODE -ne 0) { throw "Pinned runtime patch failed" }
          } finally {
            Pop-Location
          }
          "TASK23_RUNTIME_SOURCE=$runtimeSource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run MSVC compile preflight
        shell: pwsh
        run: |
          cmake -S tools/aijarvisv2-23 -B build/task23-msvc-preflight -G "Visual Studio 17 2022" -A x64 `
            -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF `
            -DAIJARVISV2_TASK23_MSVC_PREFLIGHT=ON `
            "-DJARVIS_RUNTIME_UPSTREAM_SOURCE_DIR=$env:TASK23_RUNTIME_SOURCE"
          if ($LASTEXITCODE -ne 0) { throw "MSVC preflight configure failed" }
          cmake --build build/task23-msvc-preflight --config Release --target aijarvisv2-task23-poc --parallel
          if ($LASTEXITCODE -ne 0) { throw "MSVC preflight build failed" }

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S tools/aijarvisv2-23 -B build/task23-portable -G "Visual Studio 17 2022" -A x64 `
            -T "cuda=$env:CUDA_PATH" `
            -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF '-DCMAKE_CUDA_ARCHITECTURES=86;89;120' `
            "-DJARVIS_RUNTIME_UPSTREAM_SOURCE_DIR=$env:TASK23_RUNTIME_SOURCE"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build/task23-portable --config Release --target aijarvisv2-task23-poc --parallel
          if ($LASTEXITCODE -ne 0) { throw "Portable PoC build failed" }

      - name: Install runtime dependencies and package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "build/artifact/$env:ARTIFACT_NAME"
          cmake --install build/task23-portable --config Release --prefix $packageRoot
          if ($LASTEXITCODE -ne 0) { throw "Portable dependency install failed" }
          ./tools/aijarvisv2-23/package-portable.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -PackageRoot $packageRoot `
            -SourceCommit $env:GITHUB_SHA `
            -CudaVersion $env:CUDA_VERSION `
            -CudaLicenseRoot $env:TASK23_CUDA_LICENSE_ROOT `
            -ArtifactName $env:ARTIFACT_NAME
          "TASK23_PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify portable preflight and GPU gates
        shell: pwsh
        run: |
          $portableManifestPath = Join-Path $env:TASK23_PACKAGE_ROOT "portable-manifest.json"
          $portableManifest = Get-Content -LiteralPath $portableManifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $requiredLicenses = @(
            "licenses/NVIDIA-CUDA/cuda_cudart-LICENSE.txt",
            "licenses/NVIDIA-CUDA/libcublas-LICENSE.txt"
          )
          foreach ($relativePath in $requiredLicenses) {
            $licensePath = Join-Path $env:TASK23_PACKAGE_ROOT $relativePath.Replace("/", "\")
            if (-not (Test-Path -LiteralPath $licensePath -PathType Leaf)) {
              throw "Portable Artifact is missing CUDA redistributable license: $relativePath"
            }
            $licenseSha256 = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifestEntries = @($portableManifest.files | Where-Object path -eq $relativePath)
            if ($licenseSha256 -ne "e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07" -or
                $manifestEntries.Count -ne 1 -or $manifestEntries[0].sha256 -ne $licenseSha256) {
              throw "Portable Artifact CUDA license verification failed: $relativePath"
            }
          }

          . (Join-Path $env:TASK23_PACKAGE_ROOT "gpu-capacity.ps1")
          $expectations = @(
            @{ mib = 11999; run = $false; formal = $false },
            @{ mib = 12000; run = $true; formal = $false },
            @{ mib = 16000; run = $true; formal = $true },
            @{ mib = 24576; run = $true; formal = $true },
            @{ mib = 32768; run = $true; formal = $true }
          )
          foreach ($expected in $expectations) {
            $actual = Get-Task23GpuEligibility -MemoryTotalMiB $expected.mib
            if ($actual.portable_run_gate_met -ne $expected.run -or
                $actual.task23_formal_minimum_met -ne $expected.formal) {
              throw "GPU capacity classification failed for $($expected.mib) MiB"
            }
          }

          $emptyModels = Join-Path $env:RUNNER_TEMP "missing-models"
          $emptyInput = Join-Path $env:RUNNER_TEMP "missing-o-in-07"
          New-Item -ItemType Directory -Path $emptyModels, $emptyInput -Force | Out-Null
          $message = ""
          try {
            & (Join-Path $env:TASK23_PACKAGE_ROOT "run-aijarvisv2-23.ps1") `
              -ModelRoot $emptyModels -InputRoot $emptyInput
            throw "Portable preflight unexpectedly accepted missing field inputs"
          } catch {
            $message = $_.Exception.Message
          }
          if ($message -notmatch "MODEL_ROOT" -or $message -notmatch "O_IN_07_ROOT" -or
              $message -match "git\.exe|cmake\.exe|nvcc\.exe") {
            throw "Portable missing-input guidance is not self-contained: $message"
          }
          Remove-Item -LiteralPath (Join-Path $env:TASK23_PACKAGE_ROOT "results") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload portable Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/artifact/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14

  task93-official-first:
    if: github.ref_name == 'codex/aijarvisv2-93-official-first'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ARTIFACT_NAME: AIJARVISV2-93-o-official-reference-windows-x64-cuda
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out pinned official runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tc-mb/llama.cpp-omni
          ref: 09f5c3f1b484759f17b06fc63574f749c89c8761
          path: build/task93-official-runtime-source

      - name: Verify upstream locks
        shell: pwsh
        run: |
          $lock = Get-Content tools/o-official-reference/upstream-lock.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $runtime = @($lock.components | Where-Object name -eq "llama.cpp-omni")
          $demo = @($lock.components | Where-Object name -eq "MiniCPM-o-Demo-Comni")
          $runtimeHead = git -C build/task93-official-runtime-source rev-parse HEAD
          if ($runtime.Count -ne 1 -or $runtime[0].commit -ne $runtimeHead -or
              $runtimeHead -ne "09f5c3f1b484759f17b06fc63574f749c89c8761" -or
              $demo.Count -ne 1 -or $demo[0].commit -ne "d0a002093615b7f1d4d0f87a03fc01cb39bef3f6") {
            throw "Official upstream lock verification failed"
          }

      - name: Fetch pinned CUDA redistributable licenses
        shell: pwsh
        run: |
          $redistribBase = "https://developer.download.nvidia.com/compute/cuda/redist"
          $licenseRoot = Join-Path $env:RUNNER_TEMP "task93-cuda-redistributable-licenses"
          New-Item -ItemType Directory -Path $licenseRoot -Force | Out-Null
          $manifestPath = Join-Path $licenseRoot "redistrib_$env:CUDA_VERSION.json"
          Invoke-WebRequest -Uri "$redistribBase/redistrib_$env:CUDA_VERSION.json" -OutFile $manifestPath
          $manifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestSha256 -ne "249e28a83008d711d5f72880541c8be6253f6d61608461de4fcb715554a6cf17") {
            throw "CUDA redistributable manifest hash mismatch: $manifestSha256"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $components = @(
            [pscustomobject]@{ name = "cuda_cudart"; version = "12.8.90"; license_path = "cuda_cudart/LICENSE.txt"; output = "cuda_cudart-LICENSE.txt" },
            [pscustomobject]@{ name = "libcublas"; version = "12.8.4.1"; license_path = "libcublas/LICENSE.txt"; output = "libcublas-LICENSE.txt" }
          )
          foreach ($component in $components) {
            $metadata = $manifest.PSObject.Properties[$component.name].Value
            if ($null -eq $metadata -or $metadata.version -ne $component.version -or
                $metadata.license -ne "CUDA Toolkit" -or $metadata.license_path -ne $component.license_path -or
                $null -eq $metadata.PSObject.Properties["windows-x86_64"].Value) {
              throw "CUDA redistributable metadata mismatch for $($component.name)"
            }
            $licensePath = Join-Path $licenseRoot $component.output
            Invoke-WebRequest -Uri "$redistribBase/$($component.license_path)" -OutFile $licensePath
            $licenseSha256 = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($licenseSha256 -ne "e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07") {
              throw "CUDA redistributable license hash mismatch: $licenseSha256"
            }
          }
          "TASK93_CUDA_LICENSE_ROOT=$licenseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned CUDA build toolkit
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "cuda_$env:CUDA_VERSION`_windows_network.exe"
          Invoke-WebRequest `
            -Uri "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$env:CUDA_VERSION`_windows_network.exe" `
            -OutFile $installer
          $cudaMinor = ($env:CUDA_VERSION -split '\.')[0..1] -join '.'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '-s', "nvcc_$cudaMinor", "cudart_$cudaMinor", "cublas_$cudaMinor",
            "cublas_dev_$cudaMinor", "visual_studio_integration_$cudaMinor"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA network installer failed: $($process.ExitCode)" }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$cudaMinor"
          if (-not (Test-Path -LiteralPath (Join-Path $cudaPath 'bin\nvcc.exe'))) {
            throw "CUDA nvcc was not installed under $cudaPath"
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $cudaPath 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build official llama-omni-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S build/task93-official-runtime-source -B build/task93-official-runtime ^
            -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DBUILD_SHARED_LIBS=OFF ^
            -DGGML_CUDA_CUB_3DOT2=ON -DGGML_NATIVE=OFF "-DCMAKE_CUDA_ARCHITECTURES=86;89;120" ^
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF
          if errorlevel 1 exit /b 1
          cmake --build build/task93-official-runtime --config Release --target llama-omni-server --parallel
          if errorlevel 1 exit /b 1

      - name: Build and test thin Task93 adapter
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set "runtimeSource=%GITHUB_WORKSPACE%\build\task93-official-runtime-source"
          cmake -S tools/o-official-reference -B build/task93-official-adapter ^
            -G "Ninja Multi-Config" -DBUILD_TESTING=ON ^
            "-DAIJARVIS_OFFICIAL_RUNTIME_SOURCE_DIR=%runtimeSource%"
          if errorlevel 1 exit /b 1
          cmake --build build/task93-official-adapter --config Release --parallel
          if errorlevel 1 exit /b 1
          ctest --test-dir build/task93-official-adapter -C Release --output-on-failure
          if errorlevel 1 exit /b 1
          node tools/o-official-reference/tests/static_verification.js
          if errorlevel 1 exit /b 1

      - name: Package official reference Artifact
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "build/artifact/$env:ARTIFACT_NAME"
          ./tools/o-official-reference/package-official.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -PackageRoot $packageRoot `
            -RuntimeSourceRoot (Join-Path $env:GITHUB_WORKSPACE "build/task93-official-runtime-source") `
            -RuntimeBuildRoot (Join-Path $env:GITHUB_WORKSPACE "build/task93-official-runtime") `
            -AdapterBuildRoot (Join-Path $env:GITHUB_WORKSPACE "build/task93-official-adapter") `
            -CudaLicenseRoot $env:TASK93_CUDA_LICENSE_ROOT `
            -SourceCommit $env:GITHUB_SHA `
            -ArtifactName $env:ARTIFACT_NAME
          if ($LASTEXITCODE -ne 0) { throw "Official-First packaging failed" }
          $portable = Get-Content (Join-Path $packageRoot "portable-manifest.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($portable.runtime_commit -ne "09f5c3f1b484759f17b06fc63574f749c89c8761" -or
              $portable.source_commit -ne $env:GITHUB_SHA -or
              $portable.transport -ne "/backend" -or
              $portable.models_included -ne 0 -or $portable.o_in_07_media_included -ne 0) {
            throw "Official-First portable manifest failed"
          }

      - name: Verify packaged official tools
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "build/artifact/$env:ARTIFACT_NAME"
          $server = Join-Path $packageRoot "bin/llama-omni-server.exe"
          & $server --version *> $null
          if ($LASTEXITCODE -ne 0) { throw "Packaged llama-omni-server preflight failed" }

          $emptyModels = Join-Path $env:RUNNER_TEMP "task93-empty-models"
          New-Item -ItemType Directory -Path $emptyModels -Force | Out-Null
          & (Join-Path $packageRoot "run-o-official-reference.ps1") `
            -PackageRoot $packageRoot `
            -ModelRoot $emptyModels `
            -InputRoot (Join-Path $packageRoot "fixture/O-IN-07") `
            -DryRun *> $null
          if ($LASTEXITCODE -ne 0) { throw "Packaged thin adapter dry-run failed" }

      - name: Upload official reference Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/artifact/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
